# COCO val2017 evaluation template (validation split only).
#
# We publish a COCO sanity check because it is reproducible and the checkpoint
# is the official COCO-pretrained YOLO11n. This is *not* deployment accuracy.
#
# Setup:
#   1. Download val2017.zip and annotations_trainval2017.zip from
#      https://cocodataset.org/#download. If HTTPS to images.cocodataset.org
#      fails certificate validation in your environment, use the S3 URL
#      (https://s3.amazonaws.com/images.cocodataset.org/zips/val2017.zip) or
#      plain HTTP.
#   2. Unzip images to /datasets/coco/images/val2017.
#   3. Convert only the val annotations to YOLO labels:
#        python -c "from ultralytics.data.converter import convert_coco; \
#          convert_coco(labels_dir='/datasets/coco/annotations-val', \
#          save_dir='/datasets/coco', cls91to80=True)"
#      This writes /datasets/coco/labels/val2017/*.txt.
#   4. Run:
#        python scripts/eval_yolo.py \
#          --data configs/coco-val2017.yaml \
#          --weights yolo11n.pt \
#          --classes 2,3,5,7 \
#          --imgsz 640 \
#          --name coco-val2017
#
# The four classes are car (2), motorcycle (3), bus (5), truck (7).

path: /datasets/coco
# `train` is required by Ultralytics even for validation-only runs; it is not
# read by scripts/eval_yolo.py.
train: images/val2017
val: images/val2017

names:
